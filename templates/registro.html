{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width: 500px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1>📝 Crear Cuenta</h1>
        <p style="color: var(--text-gray); margin-top: 0.5rem;">Únete a Campus Konectia hoy mismo</p>
    </div>

    {% if error %}
        <div class="error">
            <strong>⚠️ Error:</strong> {{ error }}
        </div>
    {% endif %}
    
    <form method="POST" action="/registro">
        <div class="form-group">
            <label for="user">👤 Usuario</label>
            <input 
                type="text" 
                id="user"
                name="user" 
                placeholder="Elige tu nombre de usuario"
                required
                minlength="3"
                autocomplete="username">
            <small style="color: var(--text-gray);">Mínimo 3 caracteres</small>
        </div>

        <div class="form-group">
            <label for="email">📧 Email</label>
            <input 
                type="email" 
                id="email"
                name="email" 
                placeholder="tu@email.com"
                required
                autocomplete="email">
            <small style="color: var(--text-gray);">Usaremos esto para tu cuenta</small>
        </div>

        <div class="form-group">
            <label for="password">🔐 Contraseña</label>
            <input 
                type="password" 
                id="password"
                name="password" 
                placeholder="Crea una contraseña segura"
                required
                minlength="6"
                autocomplete="new-password">
            <small style="color: var(--text-gray);">Mínimo 6 caracteres</small>
        </div>

        <button type="submit" style="margin-top: 1.5rem; width: 100%;">
            Crear Mi Cuenta
        </button>
    </form>

    <hr style="border-color: rgba(0, 102, 255, 0.2); margin: 2rem 0;">
    
    <div style="text-align: center;">
        <p style="color: var(--text-gray);">¿Ya tienes cuenta?</p>
        <a href="/" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;">
            Volver al Login
        </a>
    </div>
</div>

{% endblock %}
